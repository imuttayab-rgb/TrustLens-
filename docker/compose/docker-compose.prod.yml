# The whole product, production mode, on one machine.
#
#   cp .env.production.example .env.production
#   bash scripts/generate-keys.sh >> .env.production     # real secrets
#   docker compose -f docker/compose/docker-compose.prod.yml --env-file .env.production up -d
#
# or just run `prod-start.bat` on Windows / `make prod-up` elsewhere.
#
# ── Why this file exists ─────────────────────────────────────────────
#
# The project is handed to students who will choose a host later - or never,
# and demo it from a laptop. So the deployable unit is this compose file, not a
# platform account. Everything runs in production mode: built Next.js servers,
# uvicorn with workers, migrations as a release step, health checks, restart
# policies.
#
# ── Moving any piece to a managed service ────────────────────────────
#
# Every backing service here is addressed ONLY through an environment variable.
# To move one to a hosted provider, point the variable at it and delete (or
# stop) the local container - no application change, no rebuild:
#
#   Postgres  → DATABASE_URL, DATABASE_URL_SYNC   (Neon, Supabase, RDS, a VPS)
#   Redis     → REDIS_URL, REDIS_QUEUE_URL        (Upstash, Elasticache, a VPS)
#   S3        → STORAGE_ENDPOINT_URL + keys       (Cloudflare R2, AWS S3, Wasabi)
#   Email     → EMAIL_PROVIDER=resend + key, or SMTP_*
#
# That is the whole migration story. It is deliberately boring.
name: trustlens

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
  POSTGRES_DB: ${POSTGRES_DB:-trustlens}

# Shared by api, worker and the migrate job so the three cannot drift apart.
x-backend-env: &backend-env
  # Browser voice calls; keys remain server-side.
  CALLS_ENABLED: ${CALLS_ENABLED:-false}
  CALLS_LIVEKIT_URL: ${CALLS_LIVEKIT_URL:-}
  CALLS_LIVEKIT_INTERNAL_URL: ${CALLS_LIVEKIT_INTERNAL_URL:-}
  CALLS_LIVEKIT_API_KEY: ${CALLS_LIVEKIT_API_KEY:-}
  CALLS_LIVEKIT_API_SECRET: ${CALLS_LIVEKIT_API_SECRET:-}
  CALLS_VAPID_PUBLIC_KEY: ${CALLS_VAPID_PUBLIC_KEY:-}
  CALLS_VAPID_PRIVATE_KEY: ${CALLS_VAPID_PRIVATE_KEY:-}
  CALLS_VAPID_SUBJECT: ${CALLS_VAPID_SUBJECT:-}
  # Taken from .env.production, not hardcoded.
  #
  # `ENV=production` turns on a hardening validator that REFUSES to boot
  # without TLS to the database, real AI engines, and live API-key prefixes.
  # Those are right for a public deployment and wrong for a laptop, so the
  # local stack runs as `staging` - production *mode* (built assets, uvicorn
  # workers, migrations as a release step) without claiming to be a public
  # production system. Flip it to `production` when you actually deploy, and
  # the validator will tell you exactly what still needs setting.
  ENV: ${ENV:-staging}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
  REDIS_URL: ${REDIS_URL}
  REDIS_QUEUE_URL: ${REDIS_QUEUE_URL}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL}
  # Sign browser upload/preview URLs at this external origin; server reads
  # continue to use STORAGE_ENDPOINT_URL on the private Docker network.
  STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
  SECURITY_JWT_PRIVATE_KEY: ${SECURITY_JWT_PRIVATE_KEY:?run scripts/generate-keys.sh >> .env.production}
  SECURITY_JWT_PUBLIC_KEY: ${SECURITY_JWT_PUBLIC_KEY:?run scripts/generate-keys.sh >> .env.production}
  SECURITY_OTP_PEPPER: ${SECURITY_OTP_PEPPER:?run scripts/generate-keys.sh >> .env.production}
  SECURITY_TOKEN_PEPPER: ${SECURITY_TOKEN_PEPPER:?run scripts/generate-keys.sh >> .env.production}
  SECURITY_ENCRYPTION_KEY: ${SECURITY_ENCRYPTION_KEY:?run scripts/generate-keys.sh >> .env.production}
  SECURITY_RESPONSE_SIGNING_SECRET: ${SECURITY_RESPONSE_SIGNING_SECRET:-}
  SECURITY_JWT_ALGORITHM: ${SECURITY_JWT_ALGORITHM:-EdDSA}
  SECURITY_JWT_ISSUER: ${SECURITY_JWT_ISSUER:?set SECURITY_JWT_ISSUER in .env.production}
  SECURITY_JWT_AUDIENCE: ${SECURITY_JWT_AUDIENCE:-trustlens-web}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
  SECURITY_CORS_ORIGINS: ${SECURITY_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  # `api` is the service name on the compose network. The web container
  # server-renders through http://api:8000, so that Host header has to be
  # allowed or TrustedHostMiddleware answers 400 - and the buyer page then
  # renders not-found for every seller, with a perfectly healthy API.
  SECURITY_TRUSTED_HOSTS: ${SECURITY_TRUSTED_HOSTS:-localhost,127.0.0.1,api,web,admin}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_LOGIN_IP_PER_15MIN: ${RATE_LIMIT_LOGIN_IP_PER_15MIN:-30}
  USE_FAKE_AI: ${USE_FAKE_AI:-true}
  FACE_MATCH_REAL_IN_DEMO: ${FACE_MATCH_REAL_IN_DEMO:-false}
  # Real local CNIC OCR for the demo while the LLM stays mocked. Off by default.
  OCR_REAL_IN_DEMO: ${OCR_REAL_IN_DEMO:-false}
  HOLD_ID_REQUIRED: ${HOLD_ID_REQUIRED:-false}
  OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
  FACE_ENGINE: ${FACE_ENGINE:-insightface}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:-no-reply@trustlens.local}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT_INTERNAL:-1025}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-restart: &restart
  restart: unless-stopped

services:
  # Start explicitly: docker compose ... --profile calls up -d livekit
  # Loopback bindings are for same-computer localhost demos only.
  livekit:
    image: livekit/livekit-server:v1.13.9
    profiles: [calls]
    restart: unless-stopped
    command: [--config, /etc/livekit.yaml]
    volumes:
      - ../../.trustlens-calls/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:7882:7882/udp'

  # ── Backing services ───────────────────────────────────────────────
  # Delete any of these three once you point its URL at a managed provider.

  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      <<: *postgres-env
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/sql/init:/docker-entrypoint-initdb.d:ro
    # Not published by default. Nothing outside the compose network needs it,
    # and a Postgres on 5432 with a guessable password is how demo machines
    # get found. Uncomment to connect a GUI.
    # ports: ['${POSTGRES_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-trustlens}']
      interval: 10s
      timeout: 5s
      retries: 10
    command: ['postgres', '-c', 'max_connections=200', '-c', 'log_statement=none']

  redis:
    image: redis:7-alpine
    <<: *restart
    # appendonly protects the ARQ job queue across restarts: an identity
    # verification already accepted with a 202 must survive a reboot.
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    <<: *restart
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    ports:
      # 9000 is the actual S3 API port - without publishing it, presigned
      # URLs built from STORAGE_ENDPOINT_URL are only reachable from inside
      # the compose network, never from a browser. See .env.production.example
      # for what to set STORAGE_ENDPOINT_URL to once this is published.
      - '${LOCAL_BIND_ADDRESS:-127.0.0.1}:${STORAGE_PORT:-9000}:9000'
      - '${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001'
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://minio:9000 '${STORAGE_ACCESS_KEY_ID}' '${STORAGE_SECRET_ACCESS_KEY}';
      mc mb --ignore-existing local/trustlens-documents;
      mc mb --ignore-existing local/trustlens-listings;
      mc anonymous set none local/trustlens-documents;
      mc anonymous set none local/trustlens-listings;
      echo 'buckets ready (private)';
      "

  # Local mail sink, so verification emails are visible without a provider.
  # Set EMAIL_PROVIDER=resend and drop this service when going live for real.
  mailpit:
    image: axllent/mailpit:latest
    <<: *restart
    ports:
      - '${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ── Release step ───────────────────────────────────────────────────

  migrate:
    # Keep optional typed settings (OAuth, providers, retention) in the same private file.
    env_file: [../../.env.production]
    # The SAME image as the api service, not a second build of the same
    # Dockerfile. Without an explicit tag compose names it `trustlens-migrate`
    # and builds it separately - two identical 311 MB images, twice the build
    # time, and a startup that fails with "No such image" whenever the stack is
    # brought up with --no-build.
    image: ${TRUSTLENS_IMAGE_PREFIX:-trustlens}-api:latest
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    environment: *backend-env
    # Runs to completion and exits. api and worker wait for it, so two
    # replicas can never race on the same migration - the reason this is a
    # separate job rather than something the app does at boot.
    entrypoint: ['sh', '/app/docker/entrypoints/migrate.sh']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  # ── Application ────────────────────────────────────────────────────

  api:
    # Keep optional typed settings (OAuth, providers, retention) in the same private file.
    env_file: [../../.env.production]
    image: ${TRUSTLENS_IMAGE_PREFIX:-trustlens}-api:latest
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    <<: *restart
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      TRUSTLENS_CHAT_ENABLED: ${TRUSTLENS_CHAT_ENABLED:-false}
      TRUSTLENS_GROQ_API_KEY: ${TRUSTLENS_GROQ_API_KEY:-}
      TRUSTLENS_TAVILY_API_KEY: ${TRUSTLENS_TAVILY_API_KEY:-}
      TRUSTLENS_CHAT_PER_MINUTE: ${TRUSTLENS_CHAT_PER_MINUTE:-4}
      TRUSTLENS_CHAT_DAILY_REQUESTS: ${TRUSTLENS_CHAT_DAILY_REQUESTS:-120}
      TRUSTLENS_SEARCH_MONTHLY_LIMIT: ${TRUSTLENS_SEARCH_MONTHLY_LIMIT:-900}
    ports:
      - '${LOCAL_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    # Keep optional typed settings (OAuth, providers, retention) in the same private file.
    env_file: [../../.env.production]
    image: ${TRUSTLENS_IMAGE_PREFIX:-trustlens}-worker:latest
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    <<: *restart
    environment: *backend-env
    # The supervisor recovers in-process from a dropped Redis connection
    # (P9-09); this outer policy is for what it cannot catch - OOM, a bad
    # image, the host rebooting. Restarting reloads the OCR and face models
    # from disk, so it is the last resort, not the first.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Measured at 323 MB peak with both ONNX engines resident. The limit is
    # set above that so an actual leak is caught, rather than a busy job.
    mem_limit: ${WORKER_MEM_LIMIT:-768m}

  web:
    image: ${TRUSTLENS_IMAGE_PREFIX:-trustlens}-web:latest
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
      args:
        APP: web
        # Baked in at build time - a browser cannot read the compose
        # environment. Changing it means rebuilding, not restarting.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        # The new browser challenge is explicitly disabled on existing stacks.
        NEXT_PUBLIC_LIVE_FACE_SCAN: ${NEXT_PUBLIC_LIVE_FACE_SCAN:-false}
        # Separate opt-in: replaces only the seller's ID file inputs with webcam capture.
        NEXT_PUBLIC_LIVE_ID_SCAN: ${NEXT_PUBLIC_LIVE_ID_SCAN:-false}
        NEXT_PUBLIC_HOLD_ID_SCAN: ${NEXT_PUBLIC_HOLD_ID_SCAN:-false}
    <<: *restart
    environment:
      CSP_APP_ORIGIN: ${WEB_BASE_URL:-http://localhost:3000}
      CSP_API_ORIGIN: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      CSP_MEDIA_ORIGIN: ${CALLS_LIVEKIT_URL:-ws://localhost:7880}
      CSP_CONNECT_ORIGINS: ${CSP_CONNECT_ORIGINS:-}
      API_BASE_URL_INTERNAL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_LIVE_FACE_SCAN: ${NEXT_PUBLIC_LIVE_FACE_SCAN:-false}
      NEXT_PUBLIC_LIVE_ID_SCAN: ${NEXT_PUBLIC_LIVE_ID_SCAN:-false}
      NEXT_PUBLIC_HOLD_ID_SCAN: ${NEXT_PUBLIC_HOLD_ID_SCAN:-false}
    ports:
      - '${LOCAL_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      api: { condition: service_started }

  admin:
    image: ${TRUSTLENS_IMAGE_PREFIX:-trustlens}-admin:latest
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
      args:
        APP: admin
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    <<: *restart
    environment:
      CSP_APP_ORIGIN: ${ADMIN_BASE_URL:-http://localhost:3001}
      CSP_API_ORIGIN: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      CSP_CONNECT_ORIGINS: ${CSP_CONNECT_ORIGINS:-}
      API_BASE_URL_INTERNAL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - '${LOCAL_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-3001}:3000'
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
