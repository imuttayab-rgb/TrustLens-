[project]
name = "trustlens-shared"
version = "0.1.0"
description = "TrustLens infrastructure adapters: config, logging, crypto, cache, storage, queue, notifications."
requires-python = ">=3.12"
dependencies = [
    "trustlens-core",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.3",
    "boto3>=1.35.54",
    "aiosmtplib>=3.0.2",
    "httpx>=0.27.2",
    "uuid-utils>=0.10.0",
    "pyotp>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustlens"]
