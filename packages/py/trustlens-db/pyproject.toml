[project]
name = "trustlens-db"
version = "0.1.0"
description = "TrustLens persistence adapter: SQLAlchemy models, repositories and unit of work."
requires-python = ">=3.12"
dependencies = [
    "trustlens-core",
    "trustlens-shared",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustlens"]
