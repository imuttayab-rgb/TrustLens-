[project]
name = "trustlens-core"
version = "0.1.0"
description = "TrustLens domain model, use cases and ports. Framework-free by contract (ADR-0004)."
requires-python = ">=3.12"
# Deliberately minimal: pydantic only. Adding a framework here breaks the
# import-linter contract `core-is-pure` and fails CI.
dependencies = ["pydantic>=2.9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustlens"]
