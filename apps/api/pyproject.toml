[project]
name = "trustlens-api"
version = "0.1.0"
description = "TrustLens REST API. Thin by design - no ML dependencies (ADR-0003)."
requires-python = ">=3.12"
dependencies = [
    "trustlens-core",
    "trustlens-shared",
    "trustlens-db",
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "pillow>=11.0.0",
    "imagehash>=4.3.2",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustlens_api"]
