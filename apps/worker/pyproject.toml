[project]
name = "trustlens-worker"
version = "0.1.0"
description = "TrustLens background worker: OCR, face match, LLM analysis, scoring, webhooks."
requires-python = ">=3.12"
dependencies = [
    "trustlens-core",
    "trustlens-shared",
    "trustlens-db",
    "trustlens-ai",
    "arq>=0.26.1",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
# The heavy stack lives here, and ONLY here. The API must never install it.
#
# `onnx` is the deployed one: same class of model on onnxruntime rather than
# PyTorch and TensorFlow, so the image is ~400 MB instead of ~2.5 GB and fits a
# free tier. `ml` is kept because Phase 1 benchmarks the two against real CNICs
# (P1-01) and the report should quote a measurement, not a preference.
onnx = ["trustlens-ai[onnx,llm]"]
ml = ["trustlens-ai[ml,llm]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustlens_worker"]
